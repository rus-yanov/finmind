version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    container_name: finmind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ../backend/auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres

  user-service:
    build:
      context: ../backend/user-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres

  transaction-service:
    build:
      context: ../backend/transaction-service
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres

  sheets-service:
    build:
      context: ../backend/sheets-service
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres

  gateway:
    build:
      context: ../backend/gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - auth-service
      - user-service
      - transaction-service
      - sheets-service

volumes:
  postgres_data: